<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enquiries — FollowUp Saathi</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <div data-topbar></div>
  <main class="container">
    <div class="page-head">
      <div>
        <h1>Enquiries</h1>
        <div class="sub" id="count-line">Loading…</div>
      </div>
      <a class="btn btn-primary" href="/enquiry-details.html?new=1">+ Add enquiry</a>
    </div>

    <form class="filters" id="filter-form">
      <input type="search" id="q" name="q" placeholder="Search name, phone or service…"
             aria-label="Search enquiries">
      <select id="status" name="status" aria-label="Filter by status">
        <option value="">All statuses</option>
        <option value="NEW">New</option>
        <option value="CONTACTED">Contacted</option>
        <option value="INTERESTED">Interested</option>
        <option value="FOLLOW_UP_REQUIRED">Follow-up required</option>
        <option value="CONVERTED">Converted</option>
        <option value="NOT_INTERESTED">Not interested</option>
      </select>
      <select id="due" name="due" aria-label="Filter by follow-up due">
        <option value="">All enquiries</option>
        <option value="true">Follow-up due</option>
      </select>
      <select id="archived" name="archived" aria-label="Show archived">
        <option value="">Active</option>
        <option value="true">Archived</option>
      </select>
    </form>

    <section class="card" aria-label="Enquiry list">
      <div class="rows" id="rows">
        <div class="loading"><div class="spinner" aria-hidden="true"></div>Loading…</div>
      </div>
      <div class="pagination hidden" id="pagination">
        <span id="page-info"></span>
        <button class="btn btn-secondary btn-sm" id="prev" type="button">Previous</button>
        <button class="btn btn-secondary btn-sm" id="next" type="button">Next</button>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/enquiries.js"></script>
</body>
</html>
