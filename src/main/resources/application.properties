spring.application.name=backend

# ---------------------------------------------------------------------------
# Datasource: dedicated Docker MySQL container "followup-sathi-mysql" (8.4)
# on port 3310, database "followup_sathi", application user "followup_app".
# Setup: see SETUP_GUIDE.md at the repository root.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3310/followup_sathi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=followup_app
spring.datasource.password=followup_app_pw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA: the schema is owned by Flyway; Hibernate only validates at startup so
# an entity that drifts from the migration fails fast instead of mutating the
# database silently. Lazy loading stays explicit (open-in-view off).
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Flyway: single versioned migration (V1) creates every table, FK and index.
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Server: same origin serves both the API (/api/**) and the static frontend,
# so no CORS configuration is needed anywhere.
# ---------------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------------
# Application toggles (see com.followupsaathi.config.AppProperties).
# cookie-secure must become true when the app runs behind HTTPS.
# ---------------------------------------------------------------------------
app.session.cookie-secure=false
app.verification.code-valid-minutes=10
app.verification.resend-cooldown-seconds=60

# ---------------------------------------------------------------------------
# Actuator: only health is exposed publicly.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
